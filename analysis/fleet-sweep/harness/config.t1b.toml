# T1b (PLAN-v6 s5.1, abort rule 1): trial, 1 slot for 90 min, then all 12 slots for 30 min, K = 3 reviewers.
# One config per phase; `python -m harness run` refuses a config whose kind / n_workers / window /
# warm-up / grace / start schedule / session timeout / first task / models differ from the phase's pre-registered shape
# (harness/config.py PHASES), prints them, and asks for confirmation (or --yes).
# Everything marked UNVERIFIED must be checked before a real run; `run` refuses to start while a
# template it needs still has verified = false. Only [run] and [reviewer] parallel differ between the
# phase files (t0, t1, t2, t1b, sweep-n1-k1, sweep-n1-k3, sweep-n12-k1, sweep-n12-k3).

[run]
phase = "t1b"
kind = "trial"
n_workers = 12
window_min = 120
warmup_min = 0
grace_min = 10
start_schedule = [[0, 1], [90, 12]]   # [minute, slots open from then]
task_timeout_min = 25          # no READY this long after a launch / rework message: abandoned
task_budget_min = 20           # stated in the session prompt
first_task = ""
probe_followup = false
task_order_seed = 1234          # pass --seed per window to `reset`; the seed used is recorded
worker_model = "claude-haiku-4-5"     # Haiku 4.5 (model id string UNVERIFIED)
reviewer_model = "claude-opus-5-5"    # Opus 5.5 (model id string UNVERIFIED)
output_dir = "/Users/tom/git/carnot-sandbox-tasks/work/runs"   # private until the study ends (review reasons describe tasks)
poll_interval_s = 15
end_grace_early_when_idle = false   # real windows always run the full grace period
grace_reviews = true            # reviews of already-submitted changes continue during grace

[repo]
remote_url = "git@github.com:tombaldwin/carnot-sandbox.git"   # private sandbox repo, created 2026-09-28
work_dir = "/Users/tom/git/carnot-sandbox-tasks/work/sandbox"    # orchestrator's own clone
base_ref = "sandbox-v1"         # frozen tag main is reset to (check with `reset` against the remote before T1)
branch_prefix = "claude/task-"   # each session is told to create claude/task-<id>
accept_other_claude_branches = true   # a READY: <id> commit on another claude/* branch still counts (T0 checks naming)
tasks_file_name = "TASKS.json"

[tasks]
# FILL IN: a private local path (the tasks repo's gitignored dryrun/export/), never under this repo.
task_file = "/Users/tom/git/carnot-sandbox-tasks/export-v1/tasks.json"
hidden_tests_dir = "/Users/tom/git/carnot-sandbox-tasks/export-v1/hidden"              # <dir>/<task id>/test_*.py
reference_dir = "/Users/tom/git/carnot-sandbox-tasks/export-v1/reference"           # <dir>/<task id>.patch

[tests]
python = "/Users/tom/git/carnot-sandbox/.venv/bin/python"   # the sandbox venv
timeout_s = 300
post_hidden_scope = "merged"    # this task's hidden tests + those of every task merged this window
hidden_subdir = "tests/_hidden_acceptance"   # under tests/ so the sandbox's tests/conftest.py fixtures apply
hidden_pythonpath = ["tests", "."]           # hidden tests use `from helpers import` and `from tests.helpers import`

[reviewer]
mode = "command"
job = "checkout"                # frozen review job (PLAN-v4 s7): fresh checkout of the head + task + diff
# Verified 2026-09-28 (PLAN-v4 s7.3): flags checked on the paying account. Placeholders: {model}
# {prompt_file} {workdir} {checkout} {allowed_tools} {python}. The prompt goes in on stdin.
command = ["claude", "-p", "--model", "{model}", "--output-format", "json", "--permission-mode", "dontAsk", "--setting-sources", "project", "--strict-mcp-config", "--disable-slash-commands", "--no-session-persistence", "--tools", "Read,Grep,Glob,Bash", "--allowedTools", "{allowed_tools}"]
prompt_on_stdin = true
cwd = "{checkout}"
allowed_tools = ["Read", "Grep", "Glob", "Bash({python} -m pytest:*)"]   # verified 2026-09-28: writes, other execs and network denied
allowed_tools_sep = ","
strip_paths = [".claude", "CLAUDE.md"]
output_format = "json"          # verified: result, usage.*, total_cost_usd
verified = true   # CLI check 2026-09-28 (PLAN-v4 s7.3)
prompt_template = "prompts/reviewer.md"
timeout_s = 900
retries = 1
retry_backoff_s = 60
max_downtime_min = 10           # summed downtime of the K reviewers / K; more voids the window
parallel = 3                    # K reviewer threads r1..rK on one FIFO queue (PLAN-v6 section 6)

[launcher]
# Sessions (harness README, "Worker model"): one per slot, below. command: the `claude --cloud` template below,
# with the workaround for anthropics/claude-code#81776 (CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 and --ref):
# the session clones the sandbox from GitHub and can push, and it draws cloud-session credits (verified
# 2026-09-29, CLI 2.1.284). routine: each launch re-arms a slot routine ([launcher.routine]); it works too but
# bills plan usage, so it is kept in the code and not used. manual: the operator runs each printed command.
# `run` refuses mode = "command" while verified / followup_verified are false.
mode = "command"
launch_dir = "/Users/tom/git/carnot-sandbox-tasks/work/launch"   # local clone whose origin is [repo] remote_url; sessions launch from its main
# Without the env var, `claude --cloud` uploads a local bundle with no remote (the session cannot push), and
# `--ref main` alone refuses because the GitHub App preflight returns null for this repo. With both, the CLI
# logs "Git source: github.com/tombaldwin/carnot-sandbox, revision: main" and the session clones it.
# Placeholders: {prompt} {prompt_file} {model} {name} {run_id} {slot} {task}
launch_command = ["script", "-q", "/dev/null", "env", "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1", "claude", "--ref", "main", "--cloud", "{prompt}", "--model", "{model}", "--name", "{name}"]   # --cloud needs a TTY
session_id_regex = "(?P<session_id>session_[A-Za-z0-9]{8,})"   # T0: matches "View: https://claude.ai/code/session_..."
detach = "exit"                 # T0: the CLI exits by itself ~9 s after printing the session URL
detach_after_s = 120
launch_timeout_s = 600
detach_signal = "none"          # T0: not needed
launch_retries = 1
# Documented: `claude -p "<message>" --cloud <session-id>` queues a message and exits without waiting. UNVERIFIED
# in this harness until T0. Placeholders: {message} {message_file} {session_id} {slot} {task}
followup_command = ["claude", "-p", "{message}", "--cloud", "{session_id}"]
followup_stdin = false
followup_timeout_s = 120
stop_command = []               # none documented
verified = true            # command path with the #81776 workaround: clone and push verified 2026-09-29 (probe session, CLI 2.1.284)
followup_verified = true   # T0: claude -p "<msg>" --cloud <id> returns in ~5 s, exit 0, reaches an idle session; verified to reach routine sessions (cse_ id) 2026-09-28
worker_prompt = "prompts/worker.md"
rework_prompt = "prompts/rework.md"
# One session per slot (2026-09-29, T0d: each session costs about $0.50 to provision however little it does;
# one session doing 8 tasks cost under $1). The slot's session is launched with its first task; later tasks
# reach it as follow-up messages (next_task_prompt, logged session_message kind=task); rework goes to the
# session that did the task. A fresh session after tasks_per_session tasks, a timeout or a failed follow-up.
# "task" = one session per task (T0-T1).
session_per = "slot"
tasks_per_session = 4       # T0e 2026-09-29: a session auto-compacted during its 6th task, lost the rules and never sent READY
next_task_prompt = "prompts/next-task.md"
prompt_dir = "/Users/tom/git/carnot-sandbox-tasks/work/prompts"   # private (work/ is gitignored in the tasks repo)

[launcher.routine]
# One routine per slot, named carnot-study2-<phase>-s<k>, created disabled by
# `python -m harness routines-setup --config <this file>`, which writes their ids to the private state file
# (default: work/routines-state.json beside [repo] work_dir). Each launch re-arms the slot's routine with the
# task prompt and run_once_at = now + lead_s; runs start 40-75 s after run_once_at. The run's session id
# (cse_...) is found by polling list_runs. Every slot routine is disabled at window end.
environment_id = "env_01REHbnKNqfeaJdQr9VjHaX5"
model = "claude-haiku-4-5"
source_url = "https://github.com/tombaldwin/carnot-sandbox"
allowed_tools = ["Bash", "Read", "Write", "Edit", "Glob", "Grep"]
lead_s = 30
# One RemoteTrigger call per run of this command (verified 2026-09-28, ~9 s). {instruction} holds the exact tool input.
runner = ["claude", "-p", "{instruction}", "--model", "claude-haiku-4-5", "--permission-mode", "dontAsk", "--tools", "RemoteTrigger", "--allowedTools", "RemoteTrigger", "--strict-mcp-config", "--no-session-persistence", "--output-format", "stream-json", "--verbose"]
runner_timeout_s = 180
first_poll_delay_s = 40         # session id lookup: from run_once_at + 40 s, every 20 s, while a slot waits for it
poll_s = 20
session_id_timeout_s = 600
max_updates_per_hour = 30       # product limit: 30 fires/hour per routine, re-arms included
